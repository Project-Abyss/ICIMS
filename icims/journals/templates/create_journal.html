{% extends 'base.html' %}

{% block title %}建立日誌{% endblock %}

{% block content %}
<h1>建立日誌</h1>
<form method="POST">
    {% csrf_token %}

    <div>
        <label for="id_enterprise">實習機構:</label>
        {{ form.enterprise }}
    </div>

    <div>
        <label for="id_title">標題:</label>
        {{ form.title }}
    </div>

    <div>
        <label for="id_content">內文:</label>
        {{ form.content }}
    </div>

    <button type="submit">建立新的日誌</button>
</form>
{% endblock %}
